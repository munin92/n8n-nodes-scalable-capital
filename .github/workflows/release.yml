name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Auf Workflow-Ebene, damit `if: env.NPM_TOKEN != ''` in den Schritten greift -
# im Job-`if` ist der secrets-Kontext nicht verfuegbar.
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Release
        if: env.NPM_TOKEN != ''
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Kein NPM_TOKEN hinterlegt
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice::Release uebersprungen - Secret NPM_TOKEN fehlt." \
               "Anlegen mit: gh secret set NPM_TOKEN"

