name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nur ein Ja/Nein auf Workflow-Ebene, nicht das Geheimnis selbst: sonst laege
# der npm-Token in der Umgebung JEDES Schritts, auch beim `npm ci`, das die
# install-Skripte aller Abhaengigkeiten ausfuehrt.
env:
  HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

permissions:
  contents: write # Tags, Releases, der Release-Commit
  issues: write # @semantic-release/github kommentiert erledigte Issues
  pull-requests: write # dasselbe fuer PRs

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Bewusst ohne registry-url: das schriebe eine .npmrc mit
          # ${NODE_AUTH_TOKEN}, die mit der von @semantic-release/npm kollidiert.
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Release
        if: env.HAS_NPM_TOKEN == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Kein NPM_TOKEN hinterlegt
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::notice::Release uebersprungen - Secret NPM_TOKEN fehlt." \
               "Anlegen mit: gh secret set NPM_TOKEN"

