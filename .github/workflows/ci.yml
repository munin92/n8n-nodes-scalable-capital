name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # wie n8n selbst (2.36.7 -> node v24.18.1)
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Laedt die gebaute Klasse mit require, so wie n8ns Community-Lader.
      # Ein Fehler dabei erscheint in n8n als "Class could not be found".
      - run: npm run test:built
      # Der erzeugte Katalog muss zum Schnappschuss passen - sonst haette
      # jemand tools.generated.ts von Hand angefasst.
      - run: npm run generate && git diff --exit-code nodes/ScalableCapital/tools.generated.ts
